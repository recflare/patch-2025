; Rec Room 2025 patch configuration. Applied at injection.
; Delete a line (or the whole file) to fall back to the built-in defaults. No backend is
; baked in: leave both hosts blank and the patch makes no network changes at all.

[config]

; Backend hosts. Bare host names -- no scheme, no path.
; ApiHost rewrites ns.rec.net in the game's API requests. Leave it EMPTY to leave every
; request URI exactly as the game built it.
ApiHost=

; PhotonHost is the DNS target for Photon (*.photonengine / exitgames / photonindustries).
; Leave it EMPTY to make no Photon changes at all -- the client then connects to whatever
; Photon server its backend gives it. The app ids always come from the server.
PhotonHost=

; Requires PhotonHost. Port of the initial Photon NAME-SERVER connect; 0 = leave Photon's
; protocol default. The master/game servers are handed out by the server with their own ports.
PhotonPort=0

; Debug console window. Costs load time -- it steals focus and Unity throttles while
; unfocused. Everything it prints is already in 2025patch.log.
EnableConsole=false

; Fail third-party telemetry/analytics host lookups (RudderStack, Statsig, Backtrace,
; Unity cloud) instantly. Most are still live, so this also keeps an archival session's
; telemetry and crash dumps from reaching unrelated companies. Do not add recflare hosts.
BlockDeadHosts=true

; Verbose diagnostic tracing: request-pump probes, Photon operation/event tracers,
; HttpClient paths, BestHTTP responses. Chatty; only needed when investigating.
EnableTracing=false

; Voice (Tachyon) RSA PUBLIC key, .NET <RSAKeyValue> XML on ONE line. EMPTY = keep Rec Room's
; baked-in key (voice still works, the server just cannot read the handshake).
; Set it to your own key and the voice server can RSA-unwrap CKA/CIA and AES-decrypt AT to
; {accountId, environment, accessToken} -- i.e. authenticate the client.
; Use PKCS#1 v1.5 (not OAEP) server-side; the client encrypts with fOAEP=false.
VoiceKeyXml=
